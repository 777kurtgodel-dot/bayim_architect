# Продакшен на одном сервере: база PostgreSQL + сайт + Caddy (HTTPS-сертификаты получает сам).
# Запуск: заполните .env (см. .env.example), затем `docker compose up -d --build`.
name: baiym

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: baiym
      POSTGRES_USER: baiym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baiym -d baiym']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: baiym-site:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://baiym:${POSTGRES_PASSWORD}@db:5432/baiym
    volumes:
      - media:/app/media
      - private:/app/private
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/robots.txt || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в .env, например baiym.kg}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  media:
  private:
  caddy_data:
  caddy_config:
